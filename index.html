<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⭐ Забава Игра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #app {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 24px 20px 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }
        .user-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 18px 16px;
            margin: 8px 0 16px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 14px;
            font-size: 14px;
            line-height: 1.6;
            backdrop-filter: blur(8px);
        }
        .user-card .label {
            color: #a0a0c0;
            font-weight: 300;
        }
        .user-card .value {
            color: #f0f0ff;
            font-weight: 500;
            text-align: right;
            word-break: break-all;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .user-card .value:hover {
            color: #ffd700;
        }
        .user-card .value::after {
            content: '📋';
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
            margin-left: 4px;
        }
        .user-card .value:hover::after {
            opacity: 0.6;
        }
        .user-card .full {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 15px;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 4px;
            color: #c8c8ff;
        }
        .balance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0 18px 0;
        }
        .balance-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s;
        }
        .balance-item:hover {
            border-color: rgba(255, 215, 0, 0.2);
        }
        .balance-item .num {
            font-size: 24px;
            font-weight: 700;
            color: #ffd700;
        }
        .balance-item .num.gold { color: #ffd700; }
        .balance-item .num.cyan { color: #6bcbff; }
        .balance-item .lbl {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8888aa;
            margin-top: 4px;
        }
        .pet-status {
            background: rgba(255, 215, 0, 0.06);
            border-radius: 14px;
            padding: 12px 14px;
            margin: 10px 0 16px 0;
            border-left: 3px solid #ffd700;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .pet-status .stage { font-weight: 600; color: #ffd700; }
        .pet-status .progress { color: #b0b0e0; }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 14px 0 8px 0;
        }
        .btn {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 6px;
            font-size: 15px;
            font-weight: 600;
            color: #f0f0ff;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            backdrop-filter: blur(4px);
            user-select: none;
            font-family: inherit;
            position: relative;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3), 0 6px 12px rgba(0, 0, 0, 0.2);
            transform: translateY(0);
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 3px 8px rgba(0, 0, 0, 0.2);
        }
        .btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .btn.primary {
            background: linear-gradient(145deg, #f7971e, #ffd200);
            border-color: rgba(255, 215, 0, 0.3);
            color: #1a1a2e;
            box-shadow: 0 4px 0 #b8860b, 0 6px 12px rgba(255, 215, 0, 0.2);
        }
        .btn.primary:active {
            box-shadow: 0 1px 0 #b8860b, 0 3px 8px rgba(255, 215, 0, 0.2);
        }
        .btn.full { grid-column: 1 / -1; }
        .btn.green {
            background: linear-gradient(145deg, #00b894, #00a381);
            border-color: rgba(0, 206, 209, 0.3);
            box-shadow: 0 4px 0 #00715a, 0 6px 12px rgba(0, 206, 209, 0.2);
        }
        .btn.blue {
            background: linear-gradient(145deg, #0984e3, #0066b3);
            border-color: rgba(9, 132, 227, 0.3);
            box-shadow: 0 4px 0 #004d8a, 0 6px 12px rgba(9, 132, 227, 0.2);
        }
        .btn.purple {
            background: linear-gradient(145deg, #6c5ce7, #4a3db8);
            border-color: rgba(108, 92, 231, 0.3);
            box-shadow: 0 4px 0 #3a2f8a, 0 6px 12px rgba(108, 92, 231, 0.2);
        }
        .btn.danger {
            background: linear-gradient(145deg, #e17055, #c0392b);
            border-color: rgba(225, 112, 85, 0.3);
            box-shadow: 0 4px 0 #962d22, 0 6px 12px rgba(225, 112, 85, 0.2);
            color: #fff;
        }
        .btn.small { font-size: 13px; padding: 10px 6px; }
        .btn:disabled { opacity: 0.4; pointer-events: none; transform: translateY(0) !important; }
        .btn.support-active {
            background: linear-gradient(145deg, #f7971e, #ffd200) !important;
            border-color: #ffd700 !important;
            animation: pulse 1.5s infinite;
            color: #1a1a2e !important;
        }
        .btn .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff4757;
            color: #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }
        .codes-panel {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 10px 12px;
            margin: 8px 0 4px 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-height: 150px;
            overflow-y: auto;
        }
        .codes-panel::-webkit-scrollbar { width: 3px; }
        .codes-panel::-webkit-scrollbar-track { background: transparent; }
        .codes-panel::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 8px; }
        .codes-panel .code-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            font-size: 12px;
            color: #aaa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.2s;
            border-radius: 4px;
        }
        .codes-panel .code-item:hover {
            background: rgba(255, 215, 0, 0.05);
        }
        .codes-panel .code-item .code-text {
            font-family: monospace;
            color: #ffd700;
            font-size: 13px;
            cursor: pointer;
        }
        .codes-panel .code-item .code-text:hover {
            color: #fff;
        }
        .codes-panel .code-item .code-type {
            font-size: 10px;
            color: #666;
        }
        .codes-panel .code-item .code-delete {
            color: #ff4757;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .codes-panel .code-item .code-delete:hover {
            opacity: 1;
        }
        .contest-banner {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 14px 16px;
            margin: 10px 0 14px 0;
            text-align: center;
            animation: glowPulse 2s infinite;
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.05); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.15); }
        }
        .contest-banner .title {
            font-size: 18px;
            font-weight: 700;
            color: #ffd700;
        }
        .contest-banner .timer {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin: 6px 0;
        }
        .contest-banner .winner {
            font-size: 14px;
            color: #6bcbff;
        }
        .contest-banner .winner strong {
            color: #ffd700;
        }
        .wheel-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
        }
        .wheel-overlay.active { display: flex; }
        .wheel-container {
            max-width: 500px;
            width: 100%;
            background: rgba(20, 18, 50, 0.95);
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
            text-align: center;
        }
        .wheel-container h2 {
            font-size: 22px;
            margin-bottom: 16px;
            color: #ffd700;
        }
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px;
        }
        .wheel-wrapper canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
            cursor: pointer;
            transition: filter 0.3s;
        }
        .wheel-wrapper canvas:hover { filter: brightness(1.05); }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ffd700, #f5a623);
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            z-index: 5;
        }
        .wheel-result {
            font-size: 24px;
            font-weight: 700;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            margin: 12px 0;
            border: 1px solid rgba(255, 215, 0, 0.15);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .wheel-result .highlight {
            color: #ffd700;
            font-size: 28px;
        }
        .wheel-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .wheel-actions .btn { flex: 1; }
        .wheel-attempts {
            font-size: 14px;
            color: #8888aa;
            margin-top: 8px;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        .wheel-attempts strong {
            color: #ffd700;
        }
        .clicker-star {
            font-size: 120px;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            display: inline-block;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .clicker-star:active {
            transform: scale(0.85);
        }
        .clicker-star.pop {
            animation: starPop 0.3s ease;
        }
        @keyframes starPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); text-shadow: 0 0 60px rgba(255, 215, 0, 0.8); }
            100% { transform: scale(1); }
        }
        .clicker-progress {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0;
        }
        .clicker-progress .fill {
            height: 100%;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .clicker-stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #aaa;
            margin: 8px 0;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            max-width: 400px;
            width: 100%;
            background: #1e1c3a;
            border-radius: 28px;
            padding: 28px 24px 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 { font-size: 22px; margin-bottom: 14px; color: #fff; text-align: center; }
        .modal p { color: #c0c0e0; font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
        .modal input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
            font-family: inherit;
        }
        .modal input:focus { border-color: #f5af19; }
        .modal .flex { display: flex; gap: 8px; flex-wrap: wrap; }
        .modal .flex .btn { flex: 1; min-width: 60px; }
        .modal .flex .btn.selected {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
        }
        .scrollable { max-height: 400px; overflow-y: auto; margin-bottom: 12px; }
        .scrollable::-webkit-scrollbar { width: 4px; }
        .scrollable::-webkit-scrollbar-track { background: transparent; }
        .scrollable::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 8px; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 28px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 15px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .admin-panel .btn { font-size: 13px; padding: 10px 6px; }
        .chat-container {
            max-height: 300px;
            overflow-y: auto;
            margin: 10px 0;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 8px; }
        .chat-container .msg {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-container .msg.user {
            background: rgba(52, 152, 219, 0.3);
            margin-left: auto;
            text-align: right;
        }
        .chat-container .msg.admin {
            background: rgba(255, 215, 0, 0.2);
            margin-right: auto;
        }
        .chat-container .msg .time {
            font-size: 10px;
            color: #888;
            display: block;
            margin-top: 2px;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .leaderboard-table th {
            background: rgba(255, 215, 0, 0.1);
            padding: 8px 6px;
            text-align: left;
            color: #ffd700;
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
        }
        .leaderboard-table td {
            padding: 6px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #c0c0e0;
        }
        .leaderboard-table tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }
        .leaderboard-table .rank {
            color: #ffd700;
            font-weight: 700;
            width: 30px;
        }
        .leaderboard-table .gold { color: #ffd700; }
        .leaderboard-table .silver { color: #c0c0c0; }
        .leaderboard-table .bronze { color: #cd7f32; }
        .leaderboard-table .copy-uid {
            cursor: pointer;
            color: #6bcbff;
            font-size: 11px;
        }
        .leaderboard-table .copy-uid:hover {
            color: #fff;
        }
        .leaderboard-table .hidden-name {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>⭐ Забава Игра</h1>

        <div class="user-card" id="userCard">
            <span class="label">Имя</span><span class="value" id="userName">—</span>
            <span class="label">Пол</span><span class="value" id="userGender">—</span>
            <span class="label">Возраст</span><span class="value" id="userAge">—</span>
            <span class="label">ID</span><span class="value" id="userUid" onclick="copyUid()">—</span>
            <span class="label">Попытки</span><span class="value" id="userAttempts">0</span>
            <div class="full" id="userRegStatus">✅ Зарегистрирован</div>
        </div>

        <div class="balance-grid">
            <div class="balance-item"><div class="num gold" id="starsBalance">0</div><div class="lbl">⭐ Звёзды</div></div>
            <div class="balance-item"><div class="num cyan" id="bankBalance">0</div><div class="lbl">🏦 Банк</div></div>
        </div>

        <div id="contestBanner" style="display:none;"></div>

        <div class="pet-status" id="petStatus">
            <span class="stage" id="petStage">🪳 Малыш</span>
            <span class="progress" id="petProgress">0 / 100 ⭐</span>
        </div>

        <div id="codesPanel" style="display:none;">
            <div class="codes-panel" id="codesList"></div>
        </div>

        <div class="btn-grid">
            <button class="btn primary" id="btnPlay">🎮 Играть</button>
            <button class="btn blue" id="btnBank">🏦 Банк</button>
            <button class="btn" id="btnClicker" style="background:linear-gradient(145deg,#fd79a8,#e84393);box-shadow:0 4px 0 #a0296a;">⭐ Кликер</button>
            <button class="btn purple" id="btnCoeff">🔥 Коэфф.</button>
            <button class="btn green" id="btnPet">🪳 Питомец</button>
            <button class="btn green" id="btnBuy">🛒 Попытки</button>
            <button class="btn" id="btnCode" style="background:linear-gradient(145deg,#00b894,#00a381);box-shadow:0 4px 0 #00715a;">🎫 Код</button>
            <button class="btn" id="btnLeaderboard" style="background:linear-gradient(145deg,#6c5ce7,#4a3db8);box-shadow:0 4px 0 #3a2f8a;">🏆 Лидеры</button>
            <button class="btn full small" id="btnRules">📜 Правила</button>
            <button class="btn full small" id="btnSupport">🆘 Поддержка</button>
            <button class="btn full small danger" id="btnAdmin">🔧 Админ</button>
        </div>
    </div>

    <!-- ===== КОЛЕСО УДАЧИ ===== -->
    <div class="wheel-overlay" id="wheelOverlay">
        <div class="wheel-container">
            <h2>🎰 Колесо удачи</h2>
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
                <div class="wheel-center">⭐</div>
            </div>
            <div class="wheel-result" id="wheelResult">Нажмите "Крутить"!</div>
            <div class="wheel-attempts" id="wheelAttempts">🎮 Попыток: <strong id="wheelAttemptsCount">0</strong></div>
            <div class="wheel-actions">
                <button class="btn primary" id="wheelSpinBtn">🔄 Крутить</button>
                <button class="btn" id="wheelCloseBtn">✖ Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Модалка -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <h2 id="modalTitle">Заголовок</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  ПОЛНАЯ ЛОГИКА ИГРЫ + СОХРАНЕНИЕ
        // ============================================================

        // ---------- ПРИВЯЗКА К TELEGRAM ----------
        function getTelegramUserId() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        return String(tg.initDataUnsafe.user.id);
                    }
                }
            } catch(e) {
                console.log('Telegram WebApp не доступен');
            }
            
            let userId = localStorage.getItem('telegram_user_id');
            if (!userId) {
                userId = 'test_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                localStorage.setItem('telegram_user_id', userId);
            }
            return userId;
        }

        // ---------- ХРАНИЛИЩЕ ----------
        let users = {};
        let uidMap = {};
        let bannedUsers = {};
        let oneTimeCodes = new Set();
        let multiUseCodes = {};
        let boosterCodes = new Set();
        let boosterMultiCodes = {};
        let reports = [];
        let activeChats = {};
        let adminCodes = [];
        let contestActive = false;
        let contestStartTime = null;
        let contestDuration = 6 * 60 * 60 * 1000;
        let contestWinner = null;
        let contestEndTime = null;

        const PASSIVE_INCOME = { 1: 0, 2: 20, 3: 50, "giant": 300 };
        let userDataLoaded = false;

        // ---------- ОСНОВНЫЕ ФУНКЦИИ ----------
        function thresholdForStage(stage) {
            if (stage === 1) return 100;
            if (stage === 2) return 500;
            if (stage === 3) return 1500;
            return 0;
        }

        function generateUid() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            while (true) {
                let uid = '';
                for (let i = 0; i < 6; i++) uid += chars[Math.floor(Math.random() * chars.length)];
                if (!uidMap[uid] && uid !== "admin74zyza") return uid;
            }
        }

        function generateCode(len = 10) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let code = '';
            for (let i = 0; i < len; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        function getUser(userId) {
            if (!users[userId]) {
                const uid = generateUid();
                users[userId] = {
                    username: null,
                    attempts: 1,
                    chatId: null,
                    wins: [],
                    withdrawals: [],
                    boosted: false,
                    stars: 300,
                    petProgress: 0,
                    uid: uid,
                    coefficientRate: 0.0,
                    petStage: 1,
                    lastPassiveTime: Date.now(),
                    bank: 0,
                    bankDeposit: 0,
                    bankTime: Date.now(),
                    registered: false,
                    name: null,
                    gender: null,
                    age: null,
                    clickerProgress: 0,
                    notifications: []
                };
                uidMap[uid] = userId;
                saveToServer();
            }
            return users[userId];
        }

        function getCurrentUser() {
            const userId = getTelegramUserId();
            return getUser(userId);
        }

        function getUserByUid(uid) {
            const userId = uidMap[uid];
            if (userId) return getUser(userId);
            return null;
        }

        // ---------- СОХРАНЕНИЕ НА СЕРВЕР ----------
        async function saveToServer() {
            try {
                const user = getCurrentUser();
                const telegramId = getTelegramUserId();
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId, user_data: user })
                });
                const result = await response.json();
                return result.success;
            } catch(e) {
                console.log('Ошибка сохранения:', e);
                return false;
            }
        }

        async function loadFromServer() {
            try {
                const telegramId = getTelegramUserId();
                const response = await fetch(`/api/load/${telegramId}`);
                if (response.ok) {
                    const userData = await response.json();
                    return userData;
                }
            } catch(e) {
                console.log('Ошибка загрузки:', e);
            }
            return null;
        }

        // ---------- ОБНОВЛЕНИЯ ----------
        function updatePassiveIncome(userData) {
            const now = Date.now();
            const lastTime = userData.lastPassiveTime || now;
            if (lastTime >= now) return;
            const delta = (now - lastTime) / 3600000;
            if (delta < 1) return;
            const stage = userData.petStage || 1;
            const income = PASSIVE_INCOME[stage] || 0;
            if (income > 0) {
                const earned = Math.floor(delta * income);
                if (earned > 0) userData.stars = (userData.stars || 0) + earned;
            }
            userData.lastPassiveTime = now;
        }

        function updateBankInterest(userData) {
            const now = Date.now();
            const lastTime = userData.bankTime || now;
            if (lastTime >= now) return;
            const delta = (now - lastTime) / 3600000;
            if (delta < 1) return;
            const deposit = userData.bankDeposit || 0;
            if (deposit > 0) {
                const earned = Math.floor(deposit * 0.20 * delta);
                if (earned > 0) userData.bank = (userData.bank || 0) + earned;
            }
            userData.bankTime = now;
        }

        function addNotification(uid, message) {
            const user = getUserByUid(uid);
            if (user) {
                if (!user.notifications) user.notifications = [];
                user.notifications.push({ text: message, time: new Date().toLocaleString(), read: false });
                saveToServer();
            }
        }

        function getNotifications(uid) {
            const user = getUserByUid(uid);
            if (user && user.notifications) {
                const unread = user.notifications.filter(n => !n.read);
                user.notifications.forEach(n => n.read = true);
                return unread;
            }
            return [];
        }

        // ---------- ОТРИСОВКА ----------
        function render() {
            const user = getCurrentUser();
            updatePassiveIncome(user);
            updateBankInterest(user);

            document.getElementById('userName').textContent = user.name || '—';
            document.getElementById('userGender').textContent = user.gender || '—';
            document.getElementById('userAge').textContent = user.age || '—';
            document.getElementById('userUid').textContent = user.uid || '—';
            document.getElementById('userAttempts').textContent = user.attempts || 0;
            
            const statusEl = document.getElementById('userRegStatus');
            if (bannedUsers[user.uid]) {
                statusEl.textContent = '🚫 ЗАБЛОКИРОВАН: ' + bannedUsers[user.uid];
                statusEl.style.color = '#ff4757';
            } else {
                statusEl.textContent = '✅ Зарегистрирован';
                statusEl.style.color = '#c8c8ff';
            }

            document.getElementById('starsBalance').textContent = user.stars || 0;
            document.getElementById('bankBalance').textContent = user.bank || 0;

            const stage = user.petStage || 1;
            const progress = user.petProgress || 0;
            const threshold = thresholdForStage(stage);
            let stageText = '';
            let emoji = '🪳';
            if (stage === 1) stageText = 'Малыш';
            else if (stage === 2) stageText = 'Подросток';
            else if (stage === 3) stageText = 'Взрослый';
            else stageText = 'Гигант 👑';
            document.getElementById('petStage').textContent = emoji + ' ' + stageText;
            document.getElementById('petProgress').textContent = `${progress} / ${threshold} ⭐`;

            const supportBtn = document.getElementById('btnSupport');
            const userId = getCurrentUser().uid;
            if (activeChats[userId]) {
                if (activeChats[userId].hasNew) {
                    supportBtn.classList.add('support-active');
                    supportBtn.innerHTML = '💬 Новое сообщение! <span class="badge">1</span>';
                } else if (activeChats[userId].admin) {
                    supportBtn.classList.add('support-active');
                    supportBtn.textContent = '💬 Чат с админом';
                } else {
                    supportBtn.classList.remove('support-active');
                    supportBtn.textContent = '🆘 Поддержка';
                }
            } else {
                supportBtn.classList.remove('support-active');
                supportBtn.textContent = '🆘 Поддержка';
            }

            renderAdminCodes();
            renderContest();
            renderNotifications();
            
            const wheelAttempts = document.getElementById('wheelAttemptsCount');
            if (wheelAttempts) wheelAttempts.textContent = user.attempts || 0;
        }

        function renderNotifications() {
            const user = getCurrentUser();
            const notifs = getNotifications(user.uid);
            if (notifs.length > 0) {
                notifs.forEach(n => {
                    showToast('📩 ' + n.text, 4000);
                });
            }
        }

        function renderAdminCodes() {
            const panel = document.getElementById('codesPanel');
            const list = document.getElementById('codesList');
            if (adminCodes.length === 0) {
                panel.style.display = 'none';
                return;
            }
            panel.style.display = 'block';
            list.innerHTML = adminCodes.map((item, index) => `
                <div class="code-item">
                    <span class="code-text" onclick="copyCode('${item.code}')">${item.code}</span>
                    <span class="code-type">${item.type} ${item.target ? '→ ' + item.target : ''}</span>
                    <span class="code-delete" onclick="deleteCode(${index})">✕</span>
                </div>
            `).join('');
        }

        function renderContest() {
            const banner = document.getElementById('contestBanner');
            if (!contestActive) {
                banner.style.display = 'none';
                return;
            }
            banner.style.display = 'block';
            const now = Date.now();
            const remaining = contestEndTime - now;
            if (remaining <= 0) { endContest(); return; }
            const hours = Math.floor(remaining / 3600000);
            const minutes = Math.floor((remaining % 3600000) / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            let winnerText = '';
            if (contestWinner) {
                winnerText = `<div class="winner">🏆 Победитель: <strong>${contestWinner}</strong></div>`;
            }
            banner.innerHTML = `
                <div class="title">🏆 КОНКУРС</div>
                <div class="timer">⏱ ${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}</div>
                <div style="font-size:12px;color:#aaa;">Победит тот, у кого больше звёзд (баланс + банк)</div>
                ${winnerText}
            `;
        }

        function startContest() {
            if (contestActive) { showToast('❌ Конкурс уже запущен'); return; }
            contestActive = true;
            contestStartTime = Date.now();
            contestEndTime = contestStartTime + contestDuration;
            contestWinner = null;
            showToast('🏆 Конкурс запущен на 6 часов!');
            render();
            saveToServer();
        }

        function endContest() {
            if (!contestActive) return;
            contestActive = false;
            let maxStars = -1;
            let winnerUid = null;
            for (const uid in uidMap) {
                if (bannedUsers[uid]) continue;
                const user = getUserByUid(uid);
                if (user) {
                    const total = (user.stars || 0) + (user.bank || 0);
                    if (total > maxStars) {
                        maxStars = total;
                        winnerUid = uid;
                    }
                }
            }
            if (winnerUid) {
                contestWinner = winnerUid;
                const winner = getUserByUid(winnerUid);
                if (winner) {
                    winner.stars += 500;
                    winner.attempts += 3;
                    addNotification(winnerUid, '🏆 Вы победили в конкурсе! +500 ⭐ и +3 попытки!');
                    showToast(`🏆 Победитель: ${winnerUid}! +500 ⭐ и +3 попытки!`);
                    saveToServer();
                }
            } else {
                showToast('❌ Нет участников для конкурса');
            }
            render();
            saveToServer();
        }

        function forceEndContest() {
            if (!contestActive) { showToast('❌ Конкурс не запущен'); return; }
            endContest();
        }

        // ---------- TOAST ----------
        let toastTimeout;

        function showToast(text, duration = 2500) {
            const el = document.getElementById('toast');
            el.textContent = text;
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => el.classList.remove('show'), duration);
        }

        // ---------- МОДАЛКА ----------
        function openModal(title, html) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // ---------- КОПИРОВАНИЕ ----------
        window.copyUid = function() {
            const uid = document.getElementById('userUid').textContent;
            if (uid && uid !== '—') {
                navigator.clipboard.writeText(uid).then(() => {
                    showToast('✅ ID скопирован!');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = uid;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('✅ ID скопирован!');
                });
            }
        };

        window.copyCode = function(code) {
            navigator.clipboard.writeText(code).then(() => {
                showToast('✅ Код скопирован!');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = code;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ Код скопирован!');
            });
        };

        window.deleteCode = function(index) {
            const item = adminCodes[index];
            if (!item) return;
            const code = item.code;
            if (oneTimeCodes.has(code)) oneTimeCodes.delete(code);
            if (multiUseCodes[code]) delete multiUseCodes[code];
            if (boosterCodes.has(code)) boosterCodes.delete(code);
            if (boosterMultiCodes[code]) delete boosterMultiCodes[code];
            adminCodes.splice(index, 1);
            showToast('🗑️ Код удалён');
            render();
            saveToServer();
        };

        window.copyText = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ ID скопирован!');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ ID скопирован!');
            });
        };

        // ============================================================
        //  КОЛЕСО УДАЧИ
        // ============================================================

        const SEGMENTS = [
            { label: 'Ничего', icon: '😔', value: 0 },
            { label: '10 ⭐', icon: '⭐', value: 10 },
            { label: '25 ⭐', icon: '⭐', value: 25 },
            { label: '50 ⭐', icon: '⭐', value: 50 },
            { label: '100 ⭐', icon: '⭐', value: 100 },
            { label: '150 ⭐', icon: '🌟', value: 150 },
            { label: '200 ⭐', icon: '🌟', value: 200 },
            { label: '300 ⭐', icon: '💎', value: 300 },
            { label: '500 ⭐', icon: '💎', value: 500 },
            { label: '1000 ⭐', icon: '👑', value: 1000 }
        ];

        let wheelCanvas, ctx;
        let wheelSegments = [];
        let currentAngle = 0;
        let isSpinning = false;
        let winIndex = 0;

        function initWheel() {
            wheelCanvas = document.getElementById('wheelCanvas');
            ctx = wheelCanvas.getContext('2d');
            wheelSegments = SEGMENTS.map(s => ({ ...s }));
            drawWheel();
        }

        function drawWheel(highlightIndex = -1) {
            const w = wheelCanvas.width;
            const h = wheelCanvas.height;
            const centerX = w / 2;
            const centerY = h / 2;
            const radius = Math.min(w, h) / 2 - 10;
            const segCount = wheelSegments.length;
            const angleStep = (2 * Math.PI) / segCount;

            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < segCount; i++) {
                const startAngle = currentAngle + i * angleStep;
                const endAngle = startAngle + angleStep;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                const isHighlight = (i === highlightIndex);
                if (isHighlight) {
                    ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#3d3d5c';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                const midAngle = startAngle + angleStep / 2;
                const textRadius = radius * 0.65;
                const x = centerX + Math.cos(midAngle) * textRadius;
                const y = centerY + Math.sin(midAngle) * textRadius;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(midAngle + (midAngle > Math.PI/2 ? Math.PI : 0));

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (isHighlight) {
                    ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
                    ctx.shadowBlur = 15;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.font = '20px Segoe UI, sans-serif';
                ctx.fillStyle = isHighlight ? '#1a1a2e' : '#8888aa';
                ctx.fillText(wheelSegments[i].icon, 0, -10);

                ctx.font = '9px Segoe UI, sans-serif';
                if (wheelSegments[i].value > 0) {
                    ctx.fillStyle = isHighlight ? '#1a1a2e' : '#666688';
                    ctx.fillText(wheelSegments[i].value + '⭐', 0, 16);
                } else {
                    ctx.fillStyle = isHighlight ? '#1a1a2e' : '#444466';
                    ctx.fillText('—', 0, 16);
                }

                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 2;
            ctx.stroke();

            const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            grad.addColorStop(0, 'rgba(255,215,0,0.02)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function spinWheel() {
            if (isSpinning) return;
            const user = getCurrentUser();
            if (bannedUsers[user.uid]) {
                showToast('🚫 Вы заблокированы. Причина: ' + bannedUsers[user.uid]);
                return;
            }
            if (user.attempts <= 0) {
                showToast('❌ Попыток нет! Купите в меню.');
                return;
            }

            isSpinning = true;
            document.getElementById('wheelSpinBtn').disabled = true;
            document.getElementById('wheelResult').textContent = '🔄 Крутим...';

            user.attempts--;

            const roll = Math.random() * 100;
            if (roll < 60) winIndex = 0;
            else if (roll < 68) winIndex = 1;
            else if (roll < 75) winIndex = 2;
            else if (roll < 81) winIndex = 3;
            else if (roll < 86) winIndex = 4;
            else if (roll < 90) winIndex = 5;
            else if (roll < 94) winIndex = 6;
            else if (roll < 97) winIndex = 7;
            else if (roll < 99.3) winIndex = 8;
            else winIndex = 9;

            const segCount = wheelSegments.length;
            const angleStep = (2 * Math.PI) / segCount;
            const targetSegmentCenter = Math.PI / 2 - (winIndex * angleStep + angleStep / 2);
            const extraSpins = 3 + Math.random() * 2;
            const targetAngle = targetSegmentCenter + extraSpins * 2 * Math.PI;

            const totalSteps = 120;
            let step = 0;
            const startAngle = currentAngle;

            const spinInterval = setInterval(() => {
                step++;
                const progress = step / totalSteps;
                const eased = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + (targetAngle - startAngle) * eased;
                drawWheel(step === totalSteps ? winIndex : -1);

                if (step >= totalSteps) {
                    clearInterval(spinInterval);
                    currentAngle = targetAngle;
                    drawWheel(winIndex);
                    const result = wheelSegments[winIndex];
                    showWheelResult(result, user);
                    isSpinning = false;
                    document.getElementById('wheelSpinBtn').disabled = false;
                    render();
                    saveToServer();
                }
            }, 30);
        }

        function showWheelResult(result, user) {
            const resultDiv = document.getElementById('wheelResult');
            const coeff = user.coefficientRate || 0;

            if (result.value === 0) {
                resultDiv.innerHTML = `<span>😔</span><span>К сожалению, ничего не выиграно!</span>`;
                showToast('😔 Ничего не выиграно');
                return;
            }

            let finalValue = result.value;
            if (coeff > 0) finalValue = Math.round(result.value + coeff);

            user.stars += finalValue;
            user.wins.push({
                id: user.wins.length + 1,
                type: result.label,
                amount: finalValue,
                timestamp: new Date().toLocaleString(),
                status: 'won'
            });

            resultDiv.innerHTML = `
                <span style="font-size:40px;">${result.icon}</span>
                <span class="highlight">+${finalValue} ⭐</span>
                <span style="font-size:14px;color:#aaa;">(${result.label})</span>
                ${coeff > 0 ? `<span style="font-size:12px;color:#6bcbff;">коэфф: +${coeff}</span>` : ''}
            `;
            showToast(`🎉 +${finalValue} ⭐ (${result.label})`);
            render();
            saveToServer();
        }

        function openWheel() {
            const overlay = document.getElementById('wheelOverlay');
            overlay.classList.add('active');
            document.getElementById('wheelResult').innerHTML = 'Нажмите "Крутить"!';
            wheelSegments = SEGMENTS.map(s => ({ ...s }));
            currentAngle = 0;
            drawWheel();
            const user = getCurrentUser();
            const wheelAttempts = document.getElementById('wheelAttemptsCount');
            if (wheelAttempts) wheelAttempts.textContent = user.attempts || 0;
        }

        function closeWheel() {
            document.getElementById('wheelOverlay').classList.remove('active');
        }

        // ============================================================
        //  ОБРАБОТЧИКИ
        // ============================================================

        function handlePlay() {
            const user = getCurrentUser();
            if (bannedUsers[user.uid]) {
                showToast('🚫 Вы заблокированы. Причина: ' + bannedUsers[user.uid]);
                return;
            }
            if (user.attempts <= 0) {
                showToast('❌ Попыток нет! Купите в меню.');
                return;
            }
            openWheel();
        }

        // ---------- Банк ----------
        function handleBank() {
            const user = getCurrentUser();
            if (bannedUsers[user.uid]) {
                showToast('🚫 Вы заблокированы');
                return;
            }
            updateBankInterest(user);
            const bank = user.bank || 0;
            const deposit = user.bankDeposit || 0;
            if (bank > 0) {
                openModal('🏦 Банк (20% в час)', `
                    <p>💰 В банке: <strong>${bank}</strong> ⭐</p>
                    <p>📊 Первоначальный вклад: <strong>${deposit}</strong> ⭐</p>
                    <p>📈 Ставка: <strong style="color:#ffd700;">20% в час</strong></p>
                    <button class="btn primary full" onclick="withdrawBank()">💰 Забрать все ⭐</button>
                    <button class="btn full small" onclick="closeModal(); render();">🏠 В меню</button>
                `);
            } else {
                openModal('🏦 Банк (20% в час)', `
                    <p>Банк пуст.</p>

        window.feedPet = function() {
            const user = getCurrentUser();
            if (bannedUsers[user.uid]) { showToast('🚫 Вы заблокированы'); return; }
            const input = document.getElementById('petFeedInput');
            const amount = parseInt(input.value);
            if (!amount || amount <= 0) { showToast('❌ Введите сумму'); return; }
            if (user.stars < amount) { showToast('❌ Недостаточно звёзд'); return; }
            const stage = user.petStage || 1;
            const threshold = thresholdForStage(stage);
            const maxFeed = threshold - user.petProgress;
            if (amount > maxFeed && threshold > 0) {
                showToast(`❌ Максимум ${maxFeed} ⭐`);
                return;
            }
            user.stars -= amount;
            user.petProgress += amount;

            if (threshold > 0 && user.petProgress >= threshold) {
                user.petProgress -= threshold;
                if (stage === 1) {
                    user.stars += 200;
                    user.petStage = 2;
                    showToast('🎁 Стадия 2! +200 ⭐');
                } else if (stage === 2) {
                    user.stars += 800;
                    user.petStage = 3;
                    showToast('🎁 Стадия 3! +800 ⭐');
                } else if (stage === 3) {
                    user.stars += 1000;
                    user.petStage = 'giant';
                    showToast('🎁 Гигант! +1000 ⭐');
                }
            } else {
                showToast(`🪳 Прогресс: ${user.petProgress}/${threshold} ⭐`);
            }
            closeModal();
            render();
            saveToServer();
        };

        window.applyCode = function() {
            const user = getCurrentUser();
            if (bannedUsers[user.uid]) { showToast('🚫 Вы заблокированы'); return; }
            const input = document.getElementById('codeInput');
            const text = input.value.trim().toUpperCase();
            if (!text) { showToast('❌ Введите код'); return; }

            let found = false;
            for (const code of boosterCodes) {
                if (code.toUpperCase() === text) {
                    boosterCodes.delete(code);
                    user.attempts += 1;
                    user.boosted = true;
                    const idx = adminCodes.findIndex(item => item.code.toUpperCase() === text);
                    if (idx !== -1) adminCodes.splice(idx, 1);
                    found = true;
                    closeModal();
                    showToast('🚀 Бустер активирован!');
                    render();
                    saveToServer();
                    return;
                }
            }
            for (const code in boosterMultiCodes) {
                if (code.toUpperCase() === text) {
                    if (boosterMultiCodes[code].usedUsers.has(user.uid)) {
                        showToast('❌ Уже использован');
                        return;
                    }
                    user.attempts += 1;
                    user.boosted = true;
                    boosterMultiCodes[code].usedUsers.add(user.uid);
                    boosterMultiCodes[code].remaining--;
                    if (boosterMultiCodes[code].remaining <= 0) {
                        const idx = adminCodes.findIndex(item => item.code.toUpperCase() === text);
                        if (idx !== -1) adminCodes.splice(idx, 1);
                        delete boosterMultiCodes[code];
                    }
                    found = true;
                    closeModal();
                    showToast('🚀 Бустер активирован!');
                    render();
                    saveToServer();
                    return;
                }
            }
            for (const code of oneTimeCodes) {
                if (code.toUpperCase() === text) {
                    oneTimeCodes.delete(code);
                    user.attempts += 1;
                    const idx = adminCodes.findIndex(item => item.code.toUpperCase() === text);
                    if (idx !== -1) adminCodes.splice(idx, 1);
                    found = true;
                    closeModal();
                    showToast('✅ Код принят!');
                    render();
                    saveToServer();
                    return;
                }
            }
            for (const code in multiUseCodes) {
                if (code.toUpperCase() === text) {
                    if (multiUseCodes[code].usedUsers.has(user.uid)) {
                        showToast('❌ Уже использован');
                        return;
                    }
                    user.attempts += 1;
                    multiUseCodes[code].usedUsers.add(user.uid);
                    multiUseCodes[code].remaining--;
                    if (multiUseCodes[code].remaining <= 0) {
                        const idx = adminCodes.findIndex(item => item.code.toUpperCase() === text);
                        if (idx !== -1) adminCodes.splice(idx, 1);
                        delete multiUseCodes[code];
                    }
                    found = true;
                    closeModal();
                    showToast('✅ Код принят!');
                    render();
                    saveToServer();
                    return;
                }
            }
            if (!found) showToast('❌ Неверный код');
        };

        window.selectGender = function(g) {
            genderSelected = true;
            regData.gender = g;
            document.getElementById('genderMale').classList.toggle('selected', g === 'Мужской');
            document.getElementById('genderFemale').classList.toggle('selected', g === 'Женский');
            document.getElementById('genderMale').disabled = true;
            document.getElementById('genderFemale').disabled = true;
            showToast(`✅ Пол: ${g}`);
            checkRegistrationReady();
        };

        function checkRegistrationReady() {
            const nameInput = document.getElementById('regName');
            const ageInput = document.getElementById('regAge');
            const btn = document.getElementById('regCompleteBtn');
            if (nameInput && ageInput && btn) {
                const name = nameInput.value.trim();
                const age = parseInt(ageInput.value);
                if (name.length > 0 && age > 0 && age <= 120 && genderSelected) {
                    btn.disabled = false;
                } else {
                    btn.disabled = true;
                }
            }
        }

        document.addEventListener('input', function(e) {
            if (e.target.id === 'regName' || e.target.id === 'regAge') {
                checkRegistrationReady();
            }
        });

        window.completeRegistration = function() {
            const nameInput = document.getElementById('regName');
            const ageInput = document.getElementById('regAge');
            regData.name = nameInput.value.trim();
            regData.age = parseInt(ageInput.value);

            if (!regData.name || regData.name.length === 0) {
                showToast('❌ Введите имя');
                return;
            }
            if (!regData.age || regData.age < 1 || regData.age > 120) {
                showToast('❌ Введите возраст от 1 до 120');
                return;
            }
            if (!regData.gender) {
                showToast('❌ Выберите пол');
                return;
            }

            const user = getCurrentUser();
            user.name = regData.name;
            user.gender = regData.gender;
            user.age = regData.age;
            user.registered = true;
            closeModal();
            showToast('✅ Регистрация завершена!');
            render();
            saveToServer();
        };

        async function initGame() {
            const savedData = await loadFromServer();
            if (savedData && savedData.uid) {
                const user = getCurrentUser();
                for (const key in savedData) {
                    if (key !== 'uid' && key !== 'telegram_id') {
                        user[key] = savedData[key];
                    }
                }
                userDataLoaded = true;
                render();
            }
            checkRegistration();
        }

        // Автосохранение каждые 10 секунд
        setInterval(() => {
            if (userDataLoaded) {
                saveToServer();
            }
        }, 10000);

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            initWheel();
            initGame();

            document.getElementById('btnPlay').addEventListener('click', handlePlay);
            document.getElementById('btnBank').addEventListener('click', handleBank);
            document.getElementById('btnClicker').addEventListener('click', handleClicker);
            document.getElementById('btnCoeff').addEventListener('click', handleCoeff);
            document.getElementById('btnPet').addEventListener('click', handlePet);
            document.getElementById('btnBuy').addEventListener('click', handleBuy);
            document.getElementById('btnCode').addEventListener('click', handleCode);
            document.getElementById('btnLeaderboard').addEventListener('click', handleLeaderboard);
            document.getElementById('btnRules').addEventListener('click', handleRules);
            document.getElementById('btnSupport').addEventListener('click', handleSupport);
            document.getElementById('btnAdmin').addEventListener('click', handleAdmin);

            document.getElementById('wheelSpinBtn').addEventListener('click', spinWheel);
            document.getElementById('wheelCloseBtn').addEventListener('click', closeWheel);
            document.getElementById('wheelCanvas').addEventListener('click', spinWheel);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeWheel();
                    closeModal();
                }
            });
        });

        setInterval(render, 30000);
        setInterval(renderContest, 1000);
    </script>
</body>
</html>
